name: RepoAuditor

on:
  workflow_dispatch:

jobs:
  uv-example:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: gt-sse-center/RepoAuditor

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        
      - name: Setup RepoAuditor
        run: |
          uv sync --frozen --quiet
          uv build
        shell: bash
        
      - name: Run RepoAuditor
        run: |
          uv run repo_auditor --include GitHub --GitHub-url ${{github.server_url}}/${{github.repository}} --GitHub-pat ${{secrets.REPO_AUDITOR_PAT}}
        shell: bash
